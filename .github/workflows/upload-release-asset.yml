name: Upload release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.3.0"
      apk:
        description: "Path to the APK in the repository"
        required: true
        default: "release/todo-1.3.0.apk"
      checksum:
        description: "Path to the SHA-256 file in the repository"
        required: true
        default: "release/todo-1.3.0.apk.sha256"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload APK and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          APK: ${{ github.event.inputs.apk }}
          CHECKSUM: ${{ github.event.inputs.checksum }}
        run: |
          set -euo pipefail
          test -f "$APK"
          test -f "$CHECKSUM"
          gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          gh release view "$TAG" --json url,assets
